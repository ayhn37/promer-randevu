<div style="background: #0f172a; padding: 20px; border-radius: 10px; margin: 20px;">
    <h3 style="color: white; font-weight: bold; margin-bottom: 10px;">Yapay Zeka Ayarları</h3>
    <textarea id="ai-prompt-input" style="width: 100%; height: 150px; background: #1e293b; color: white; padding: 10px; border-radius: 5px; border: 1px solid #334155;" placeholder="Yapay zekaya talimatlarınızı buraya yazın..."></textarea>
    <br><br>
    <button onclick="savePrompt()" style="background: #1e40af; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold;">Kaydet</button>
    <span id="save-msg" style="color: #4ade80; display: none; margin-left: 10px;">Kaydedildi!</span>
</div>

<script>
    // Sayfa açılınca Firebase'den mevcut ayarı çek
    window.addEventListener('load', () => {
        setTimeout(async () => {
            if(window.firebaseDB && window.firebaseDoc) {
                try {
                    const snap = await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDB, "settings", "ai_config"));
                    if (snap.exists() && snap.data().prompt) {
                        document.getElementById('ai-prompt-input').value = snap.data().prompt;
                    }
                } catch(e) { console.log(e); }
            }
        }, 1500);
    });

    // Kaydet butonuna basınca Firebase'e yaz
    async function savePrompt() {
        const text = document.getElementById('ai-prompt-input').value;
        if(window.firebaseDB && window.firebaseSetDoc) {
            await window.firebaseSetDoc(window.firebaseDoc(window.firebaseDB, "settings", "ai_config"), { prompt: text });
            document.getElementById('save-msg').style.display = 'inline';
            setTimeout(() => document.getElementById('save-msg').style.display = 'none', 3000);
        } else {
            alert("Firebase bağlantısı bekleniyor, lütfen sayfayı yenileyin.");
        }
    }
</script>
