    <!-- ⭐ GÖMÜLÜ YAPAY ZEKA ASİSTANI SCRIPT'İ ⭐ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatForm = document.getElementById('ai-chat-form');
            const chatInput = document.getElementById('ai-chat-input');
            const chatMessages = document.getElementById('ai-chat-messages');
            
            const WORKER_URL = 'https://gemini-proxy.promerilaclama.workers.dev';

            let chatHistory = [];
            
            // Firebase'den Admin Panelindeki Yazıyı Çek (Sayfa açıldığında)
            setTimeout(async () => {
                if (window.firebaseDB && window.firebaseDoc && window.firebaseGetDoc) {
                    try {
                        const snap = await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDB, "settings", "ai_config"));
                        if (snap.exists() && snap.data().prompt) {
                            chatHistory = [
                                { role: "user", text: snap.data().prompt },
                                { role: "model", text: "Anladım. Kurallarınıza harfiyen uyacağım." }
                            ];
                            console.log("✅ Prompt admin panelinden başarıyla yüklendi.");
                            return;
                        }
                    } catch(e) { console.log("Prompt çekilemedi:", e); }
                }
                // Veritabanında yoksa varsayılan kural
                chatHistory = [
                    { role: "user", text: "Sen Promer İlaçlama asistanısın. İlaçlama süreçleri ve sonrası hakkında kısa ve net bilgi ver. Fiyat için 0850 466 00 22'yi aramalarını söyle." },
                    { role: "model", text: "Anladım. Size nasıl yardımcı olabilirim?" }
                ];
            }, 1000);

            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const message = chatInput.value.trim();
                if (!message) return;

                appendMessage('user', message);
                chatInput.value = '';
                
                const typingIndicator = showTyping();
                chatHistory.push({ role: "user", text: message });

                try {
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages: chatHistory })
                    });

                    const data = await response.json();
                    typingIndicator.remove();

                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        const botReply = data.choices[0].message.content;
                        appendMessage('model', botReply);
                        chatHistory.push({ role: "model", text: botReply });
                    } else if (data.error) {
                        appendMessage('model', 'HATA: ' + (data.error.message || JSON.stringify(data.error)));
                    } else {
                        appendMessage('model', 'Cevap alınamadı, lütfen tekrar deneyin.');
                    }
                } catch (error) {
                    typingIndicator.remove();
                    appendMessage('model', 'Bağlantı hatası: ' + error.message);
                }
            });

            function appendMessage(role, text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `flex items-end gap-2 max-w-[90%] ${role === 'user' ? 'self-end flex-row-reverse' : 'self-start'}`;
                
                const avatar = role === 'user' 
                    ? `<div class="w-6 h-6 bg-slate-300 rounded-full flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-user text-white text-[10px]"></i></div>`
                    : `<div class="w-6 h-6 bg-promer-navy rounded-full flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-robot text-white text-[10px]"></i></div>`;

                const bubbleClass = role === 'user'
                    ? 'bg-promer-blue text-white chat-bubble-user shadow-md'
                    : 'bg-white border border-slate-200 text-slate-800 chat-bubble-ai shadow-sm';

                const formattedText = text.replace(/\n/g, '<br>');

                messageDiv.innerHTML = `
                    ${avatar}
                    <div class="${bubbleClass} p-2.5">
                        ${formattedText}
                    </div>
                `;
                
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function showTyping() {
                const div = document.createElement('div');
                div.className = 'flex items-end gap-2 max-w-[90%] self-start typing-container';
                div.innerHTML = `
                    <div class="w-6 h-6 bg-promer-navy rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-robot text-white text-[10px]"></i>
                    </div>
                    <div class="bg-white border border-slate-200 p-3 rounded-2xl rounded-bl-none shadow-sm flex gap-1 items-center h-[36px]">
                        <div class="w-1 h-1 bg-slate-400 rounded-full typing-dot"></div>
                        <div class="w-1 h-1 bg-slate-400 rounded-full typing-dot"></div>
                        <div class="w-1 h-1 bg-slate-400 rounded-full typing-dot"></div>
                    </div>
                `;
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return div;
            }
        });
    </script>
